version: '3.9'

services:
  webapi:
    build:
      context: .
      dockerfile: MicroserviceFirst.API/Dockerfile
    container_name: dotnet9-webapi
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  redis-master:
    image: redis:latest
    container_name: redis-master
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]

  redis-slave-1:
    image: redis:latest
    container_name: redis-slave-1
    depends_on:
      - redis-master
    ports:
      - "6380:6379"
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--protected-mode", "no"]

  redis-slave-2:
    image: redis:latest
    container_name: redis-slave-2
    depends_on:
      - redis-master
    ports:
      - "6381:6379"
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--protected-mode", "no"]

  redis-slave-3:
    image: redis:latest
    container_name: redis-slave-3
    depends_on:
      - redis-master
    ports:
      - "6382:6379"
    command: ["redis-server", "--replicaof", "redis-master", "6379", "--protected-mode", "no"]

  sentinel-1:
    image: redis:latest
    container_name: redis-sentinel-1
    depends_on:
      - redis-master
      - redis-slave-1
      - redis-slave-2
      - redis-slave-3
    ports:
      - "26379:26379"
    command: >
      sh -c 'echo "port 26379" > /etc/sentinel.conf &&
             echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
             echo "sentinel monitor mymaster redis-master 6379 2" >> /etc/sentinel.conf &&
             echo "sentinel down-after-milliseconds mymaster 1000" >> /etc/sentinel.conf &&
             echo "sentinel failover-timeout mymaster 5000" >> /etc/sentinel.conf &&
             echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
             redis-server /etc/sentinel.conf --sentinel'

  sentinel-2:
    image: redis:latest
    container_name: redis-sentinel-2
    depends_on:
      - redis-master
      - redis-slave-1
      - redis-slave-2
      - redis-slave-3
    ports:
      - "26380:26379"
    command: >
      sh -c 'echo "port 26379" > /etc/sentinel.conf &&
             echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
             echo "sentinel monitor mymaster redis-master 6379 2" >> /etc/sentinel.conf &&
             echo "sentinel down-after-milliseconds mymaster 1000" >> /etc/sentinel.conf &&
             echo "sentinel failover-timeout mymaster 5000" >> /etc/sentinel.conf &&
             echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
             redis-server /etc/sentinel.conf --sentinel'

  sentinel-3:
    image: redis:latest
    container_name: redis-sentinel-3
    depends_on:
      - redis-master
      - redis-slave-1
      - redis-slave-2
      - redis-slave-3
    ports:
      - "26381:26379"
    command: >
      sh -c 'echo "port 26379" > /etc/sentinel.conf &&
             echo "sentinel resolve-hostnames yes" >> /etc/sentinel.conf &&
             echo "sentinel monitor mymaster redis-master 6379 2" >> /etc/sentinel.conf &&
             echo "sentinel down-after-milliseconds mymaster 1000" >> /etc/sentinel.conf &&
             echo "sentinel failover-timeout mymaster 5000" >> /etc/sentinel.conf &&
             echo "sentinel parallel-syncs mymaster 1" >> /etc/sentinel.conf &&
             redis-server /etc/sentinel.conf --sentinel'